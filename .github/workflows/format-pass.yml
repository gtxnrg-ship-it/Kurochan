name: One-time repository format pass

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  format-and-verify:
    if: contains(github.event.head_commit.message, '[format-pass]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and pinned specialist catalog
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format tracked project files
        run: pnpm format
      - name: Normalize edited backend and test sources
        run: >-
          pnpm exec prettier --write
          apps/server/src/server.ts
          apps/worker/src/main.ts
          packages/orchestrator/src/web-research.ts
          packages/orchestrator/src/worker.ts
          packages/orchestrator/test/web-research.test.ts
          packages/orchestrator/test/worker.test.ts
      - name: Run complete repository checks before publishing formatting
        run: pnpm check
      - name: Commit formatting and dispatch canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -u
            git commit -m "style: format backend and test sources"
            git push origin HEAD:main
          fi
          gh workflow run ci.yml --ref main
