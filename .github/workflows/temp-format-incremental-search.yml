name: Temporary formatting pass for incremental search

on:
  push:
    branches:
      - backend/incremental-codebase-search-2026-10-24

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format touched TypeScript files
        run: pnpm exec prettier --write packages/orchestrator/src/workspace.ts packages/storage/src/index.ts packages/storage/test/run-store.test.ts
      - name: Remove one-time formatter and commit formatting
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          rm .github/workflows/temp-format-incremental-search.yml
          git add -A packages/orchestrator/src/workspace.ts packages/storage/src/index.ts packages/storage/test/run-store.test.ts .github/workflows/temp-format-incremental-search.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format incremental codebase search changes"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
