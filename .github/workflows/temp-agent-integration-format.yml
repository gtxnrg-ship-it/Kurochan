name: Temporary agent integration formatter

on:
  push:
    branches:
      - integration/agent-runtime-completion-2026-10-24

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/agent-runtime-completion-2026-10-24
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format only the integration files
        run: >-
          pnpm exec prettier --write
          packages/orchestrator/src/mcp-tools.ts
          packages/orchestrator/src/worker.ts
          packages/orchestrator/src/workspace.ts
          packages/orchestrator/test/worker.test.ts
          packages/orchestrator/test/workspace-integration.test.ts
      - name: Run the complete repository checks
        run: pnpm check
      - name: Commit formatter output when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/orchestrator/src/mcp-tools.ts packages/orchestrator/src/worker.ts packages/orchestrator/src/workspace.ts packages/orchestrator/test/worker.test.ts packages/orchestrator/test/workspace-integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format agent runtime integration changes"
            git push origin HEAD:integration/agent-runtime-completion-2026-10-24
          fi
