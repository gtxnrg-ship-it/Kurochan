name: Temporary worker formatter diff

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Show formatter changes
        run: |
          pnpm exec prettier packages/orchestrator/src/worker.ts > /tmp/worker.ts
          diff -u packages/orchestrator/src/worker.ts /tmp/worker.ts || true
          pnpm exec prettier packages/orchestrator/test/worker.test.ts > /tmp/worker.test.ts
          diff -u packages/orchestrator/test/worker.test.ts /tmp/worker.test.ts || true
