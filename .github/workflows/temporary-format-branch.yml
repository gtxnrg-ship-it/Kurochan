name: Temporary format branch files

on:
  push:
    branches: [fix/backend-reliability-2026-10-24]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format files flagged by CI
        run: |
          pnpm exec prettier --write \
            apps/server/test/server.test.ts \
            apps/web/package.json \
            apps/web/public/app.css \
            apps/web/public/app.js \
            apps/web/public/index.html \
            apps/web/public/sw.js \
            apps/web/test/api.test.ts
      - name: Commit formatting corrections
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/test/server.test.ts \
            apps/web/package.json \
            apps/web/public/app.css \
            apps/web/public/app.js \
            apps/web/public/index.html \
            apps/web/public/sw.js \
            apps/web/test/api.test.ts
          git commit -m "Format frontend and backend test files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
