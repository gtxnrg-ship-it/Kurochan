name: One-time branch formatting

on:
  push:
    branches: [fix/backend-reliability-2026-10-24]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[branch-format-pass]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: pnpm format
      - name: Verify build, tests, and formatting
        run: pnpm check
      - name: Commit formatted files to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/server.ts apps/server/test/server.test.ts packages/orchestrator/src/community-packs.ts packages/orchestrator/src/worker.ts packages/orchestrator/test/community-packs.test.ts packages/orchestrator/test/web-research.test.ts scripts/check-community-packs.mjs package.json
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "style: apply canonical Prettier formatting"
            git push origin HEAD:fix/backend-reliability-2026-10-24
          fi
