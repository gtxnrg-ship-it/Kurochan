name: Temporary frontend formatter diff

on:
  push:
    branches: [docs/frontend-integrations-2026-10-24]

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier apps/web/public/app.js > /tmp/app.js
          diff -u apps/web/public/app.js /tmp/app.js || true
          pnpm exec prettier apps/web/public/app.css > /tmp/app.css
          diff -u apps/web/public/app.css /tmp/app.css || true
          pnpm exec prettier apps/web/test/integrations.test.ts > /tmp/integrations.test.ts
          diff -u apps/web/test/integrations.test.ts /tmp/integrations.test.ts || true
