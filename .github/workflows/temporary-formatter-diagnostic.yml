name: Temporary formatter diagnostic

on:
  push:
    branches: [fix/backend-reliability-2026-10-24]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Show exact formatting diffs
        run: |
          pnpm exec prettier packages/orchestrator/src/worker.ts > /tmp/worker.ts
          diff -u packages/orchestrator/src/worker.ts /tmp/worker.ts || true
          pnpm exec prettier packages/storage/src/index.ts > /tmp/storage.ts
          diff -u packages/storage/src/index.ts /tmp/storage.ts || true
