name: Temporary voice UI formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting to touched files
        run: |
          pnpm exec prettier --write \
            apps/web/public/app.js \
            apps/web/test/api.test.ts
      - name: Commit format corrections
        run: |
          if git diff --quiet; then
            echo "Files already match the formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/app.js apps/web/test/api.test.ts
          git commit -m "Format recorded voice client integration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
