name: Temporary formatter diagnostic

on:
  push:
    branches: [fix/backend-reliability-2026-10-24]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Print formatter diffs only
        run: |
          for file in apps/server/src/server.ts apps/server/test/server.test.ts packages/model-gateway/src/speech.ts packages/orchestrator/src/planner.ts packages/orchestrator/src/worker.ts packages/orchestrator/test/planner.test.ts; do
            output="/tmp/$(basename "$file")"
            pnpm exec prettier "$file" > "$output"
            diff -u "$file" "$output" || true
          done
